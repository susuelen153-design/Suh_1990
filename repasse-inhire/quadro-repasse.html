<title>Repasse InHire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Tema escuro único. Layout: cabeçalho com resumo → barra de filtros → visão (Projetos por tipo / Lista / Quadro por status / Responsáveis) → gaveta lateral de edição */
:root{
  /* paleta do Grupo Daycoval (deck Programa Delta): marinho 203764/1B438B, ciano 00ADEF, fundo 060C24 */
  --bg:#060c24; --surface:#0f1a3c; --sunk:#16234d; --line:#26386e; --ink:#e8eefb; --muted:#9aa9cc;
  --accent:#00adef; --accent-soft:#0b3557; --accent-ink:#04122a; --navy:#1b438b;
  --todo:#a9b6d6; --doing:#4cc6ff; --block:#ff9a62; --done:#5fd08a;
  --todo-bg:#1a2550; --doing-bg:#0c3159; --block-bg:#3a2216; --done-bg:#12321f;
  --high:#ff8a7a; --mid:#ffc857; --low:#9aa9cc; --shadow:0 12px 32px rgba(0,0,0,.6);
  --t1:#00adef; --t2:#6b9bff; --t3:#ffc857; --t4:#7fe0d2; --t5:#ff8fb8; --t6:#a9d46f;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 500px at 85% -10%,#12306b 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,34px);letter-spacing:-.01em}
h1 .delta{color:var(--accent)}
.sub{color:var(--muted);max-width:68ch;margin:4px 0 0}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* resumo */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat b{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.warn b{color:var(--block)}
button.stat:hover{border-color:var(--accent)}
.projbars[hidden]{display:none}
.projbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px}
.pb{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.pb .row{display:flex;justify-content:space-between;gap:8px}
.pb .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb .row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* barra de ferramentas */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(6,12,36,.94);backdrop-filter:blur(6px);padding-block:8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;background:var(--sunk);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar select,.toolbar input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
.toolbar input[type=search]{flex:1 1 160px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--high);border-color:var(--high);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-todo{color:var(--todo);background:var(--todo-bg)} .s-doing{color:var(--doing);background:var(--doing-bg)}
.s-block{color:var(--block);background:var(--block-bg)} .s-done{color:var(--done);background:var(--done-bg)}
.h-upd{color:var(--mid);background:#3a2e10} .h-keep{color:var(--done);background:var(--done-bg)} .h-new{color:var(--doing);background:var(--doing-bg)} .h-eval{color:var(--todo);background:var(--todo-bg)}
.due.ok{color:var(--done)}
.measure{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.measure table{min-width:760px}
.measure td.pc{min-width:140px}
.measure .mini{display:flex;align-items:center;gap:8px}
.measure .mini .bar{flex:1;min-width:60px}
.measure tfoot td{font-weight:600;border-bottom:0}
.prio{font:500 12px var(--f-mono);letter-spacing:.02em}
.prio.Alta{color:var(--high)} .prio.Média{color:var(--mid)} .prio.Baixa{color:var(--low)}
.who{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.none{color:var(--block);font-style:italic}
.due{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.due.late{color:var(--high)}

/* projetos por tipo */
.tgroup{display:flex;flex-direction:column;gap:10px}
.thead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.thead h2{font-size:20px;color:var(--tc)}
.thead span{color:var(--muted);font-size:13px}
.tchip{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--tc)}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:10px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard:hover{border-color:var(--tc)}
.pcard h3{font-size:20px;line-height:1.2}
.pcard p{margin:0;color:var(--muted);font-size:13px}
.pcard .nums{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pcard .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.pcard .nums b.w{color:var(--block)}
.stack{display:flex;flex-direction:column;gap:22px}

/* universidades */
.funnel{display:flex;flex-wrap:wrap;gap:8px}
.funnel button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.funnel button b{font-variant-numeric:tabular-nums}
.funnel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.uni{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.uni table{min-width:900px}
.uni tr.inst td{background:var(--sunk);font:600 15px var(--f-display);color:var(--ink)}
.uni tr.inst td small{font:400 12.5px var(--f-body);color:var(--muted);margin-left:8px}
.uni td{vertical-align:top}
.uni tbody tr:not(.inst){cursor:pointer}
.uni tbody tr:not(.inst):hover td{background:var(--sunk)}
.uni .muted{color:var(--muted);font-size:13px}
.c-map{color:var(--todo);background:var(--todo-bg)} .c-contact{color:var(--doing);background:var(--doing-bg)} .c-meet{color:#a9b8ff;background:#1f2a66}
.c-talk{color:var(--mid);background:#3a2c12} .c-done{color:var(--done);background:var(--done-bg)} .c-partner{color:var(--accent);background:var(--accent-soft)} .c-no{color:var(--block);background:var(--block-bg)}

/* lista */
.project{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.phead > div{min-width:0;flex:1 1 300px}
.phead h2{font-size:19px}
.phead p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:80ch}
.section-label{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 16px 6px;background:var(--sunk)}
.scroll{overflow-x:auto}
.trow{display:grid;grid-template-columns:28px minmax(240px,1fr) 150px 120px 96px 56px 92px;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);min-width:830px}
.trow:first-child{border-top:0}
.trow.head{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface);border-top:0;padding-block:8px}
.trow:not(.head):hover{background:var(--sunk)}
.tt{border:0;background:none;text-align:left;padding:0;min-width:0;display:flex;flex-direction:column;gap:1px}
.tt strong{font-weight:500}
.tt small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-row .tt strong{text-decoration:line-through;color:var(--muted)}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.tick[aria-checked="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.tick svg{width:12px;height:12px}

/* quadro */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font:600 14px var(--f-body);display:flex;justify-content:space-between;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.card:hover{border-color:var(--accent)}
.card .proj{font:500 11px var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:center}

/* responsáveis */
.matrix{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{text-align:center;font-variant-numeric:tabular-nums}
td.n button{border:0;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:2px 9px;font-weight:600}
td.n .z{color:var(--line)}
.person-none td:first-child{color:var(--block);font-style:italic}

/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(3,7,22,.6);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.dfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.dfoot .msg{font-size:13px;color:var(--muted);flex:1 1 100%}
.linkout{font-size:13px;color:var(--accent);word-break:break-all}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.notice{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Grupo Daycoval · Recrutamento e Seleção</div>
    <h1>Repasse InHire</h1>
    <p class="sub">Projetos, entregáveis pendentes e quem assume cada frente na saída da Suellen. Clique numa tarefa para editar status, sucessor(a), prazo e notas; tudo fica salvo para quem abrir esta página.</p>
  </header>

  <section class="summary" id="summary" aria-label="Resumo"></section>
  

  <div class="toolbar" role="toolbar" aria-label="Filtros e visões">
    <div class="tabs" role="group" aria-label="Visão">
      <button id="tab-projects" data-view="projects" aria-pressed="true">Projetos</button>
      <button id="tab-list" data-view="list" aria-pressed="false">Lista</button>
      <button id="tab-unis" data-view="unis" aria-pressed="false">Universidades</button>
      <button id="tab-board" data-view="board" aria-pressed="false">Quadro</button>
      <button id="tab-people" data-view="people" aria-pressed="false">Responsáveis</button>
    </div>
    <select id="f-type" aria-label="Filtrar por tipo de projeto"></select>
    <select id="f-project" aria-label="Filtrar por projeto"></select>
    <select id="f-person" aria-label="Filtrar por sucessor(a)"></select>
    <select id="f-status" aria-label="Filtrar por status"></select>
    <select id="f-hand" aria-label="Filtrar por situação no repasse"></select>
    <input id="f-q" type="search" placeholder="Buscar tarefa, nota ou entregável" aria-label="Buscar">
    <label class="chk"><input id="f-open" type="checkbox"> Só pendentes</label>
    <span class="spacer"></span>
    <button class="btn" id="btn-proj">+ Projeto</button>
    <button class="btn primary" id="btn-task">+ Tarefa</button>
    <button class="btn" id="btn-contact" hidden>+ Contato</button>
    <button class="btn" id="btn-csv" hidden>Exportar CSV (Asana)</button>
    <button class="btn" id="btn-ccsv" hidden>Exportar contatos (CSV)</button>
  </div>

  <p class="notice" id="notice">Carregando o quadro…</p>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="d-title"></aside>
<div class="toast" id="toast" hidden></div>

<script>
const STATUSES=[["A fazer","s-todo"],["Em andamento","s-doing"],["Bloqueado","s-block"],["Concluído","s-done"]];
const PRIOS=["Alta","Média","Baixa"];
const HAND=[["Atualizar","h-upd","Existe, mas precisa de atualização antes do repasse"],["Manter","h-keep","Está pronto: repassar como está"],["Criar","h-new","Ainda não existe: precisa ser feito"],["A avaliar","h-eval","Falta decidir"]];
const HC=Object.fromEntries(HAND.map(h=>[h[0],h[1]]));
const CSTAT=[["Mapear contato","c-map"],["Contato feito","c-contact"],["Reunião agendada","c-meet"],["Palestra agendada","c-talk"],["Palestra realizada","c-done"],["Parceria ativa","c-partner"],["Sem retorno","c-no"]];
const CC=Object.fromEntries(CSTAT);
const CHANNELS=["Centro de carreiras","Empresa júnior","Liga / entidade estudantil","Professor / coordenação","Cia de Estágios","Outro"];
const SC=Object.fromEntries(STATUSES);
const NONE="__none__";
const state={projects:[],tasks:[],contacts:[],cs:"",view:"projects",ft:"",fp:"",fperson:"",fs:"",fh:"",q:"",open:false,canWrite:true,db:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?d.split("-").reverse().join("/"):"";
const TYPE_ORDER=["Gestão do repasse","Manutenção","InHire · Nova ATS","Programa Delta"];
const ptype=p=>(p&&p.type)||"Outros";
const types=()=>{const ts=[...new Set(state.projects.map(ptype))];return ts.sort((a,b)=>((TYPE_ORDER.indexOf(a)+1)||99)-((TYPE_ORDER.indexOf(b)+1)||99)||a.localeCompare(b))};
const tcolor=t=>{const i=types().indexOf(t);return `var(--t${(i%6)+1})`};
const sortP=(a,b)=>((types().indexOf(ptype(a)))-(types().indexOf(ptype(b))))||a.order-b.order;
const visProjects=()=>[...state.projects].sort(sortP).filter(p=>(!state.ft||ptype(p)===state.ft)&&(!state.fp||p.id===state.fp));
const pname=id=>(state.projects.find(p=>p.id===id)||{}).name||"Sem projeto";

try{const v=localStorage.getItem("repasse-view");if(v)state.view=v}catch(e){}

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

function filtered(){
  const q=state.q.trim().toLowerCase();
  return state.tasks.filter(t=>{
    if(state.fp&&t.project!==state.fp)return false;
    if(state.ft&&ptype(state.projects.find(p=>p.id===t.project))!==state.ft)return false;
    if(state.fperson===NONE&&t.successor)return false;
    if(state.fperson&&state.fperson!==NONE&&t.successor!==state.fperson)return false;
    if(state.fs&&t.status!==state.fs)return false;
    if(state.fh&&(t.handover||"A avaliar")!==state.fh)return false;
    if(state.open&&t.status==="Concluído")return false;
    if(q&&!(t.title+" "+t.notes+" "+t.deliverable+" "+t.section).toLowerCase().includes(q))return false;
    return true;
  });
}
const sortT=(a,b)=>(a.order||0)-(b.order||0)||a.id.localeCompare(b.id);
const people=()=>[...new Set(state.tasks.map(t=>t.successor).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

function renderSummary(){
  const T=state.tasks, open=T.filter(t=>t.status!=="Concluído");
  const late=open.filter(t=>t.due&&t.due<today()).length;
  const s=[
    ["Pendentes",open.length,"",()=>{state.open=true;state.fs="";state.fperson=""}],
    ["Sem sucessor(a)",open.filter(t=>!t.successor).length,"warn",()=>{state.fperson=NONE;state.open=true}],
    ["Precisam de atualização",open.filter(t=>t.handover==="Atualizar").length,"",()=>{state.fh="Atualizar";state.open=true;state.view="list"}],
    ["Bloqueadas",T.filter(t=>t.status==="Bloqueado").length,"warn",()=>{state.fs="Bloqueado";state.open=false}],
    ["Atrasadas",late,"warn",()=>{state.open=true}],
    ["Concluídas",T.filter(t=>t.status==="Concluído").length+" / "+T.length,"",()=>{state.fs="Concluído";state.open=false;state.view="list"}],
  ];
  $("#summary").innerHTML=s.map((x,i)=>`<button class="stat ${x[2]&&+x[1]>0?x[2]:""}" data-i="${i}"><b>${x[1]}</b><span>${x[0]}</span></button>`).join("");
  $("#summary").querySelectorAll("button").forEach(b=>b.onclick=()=>{s[b.dataset.i][3]();syncFilters();render()});
}

function syncFilters(){
  $("#f-type").innerHTML=`<option value="">Todos os tipos</option>`+types().map(t=>`<option>${esc(t)}</option>`).join("");
  const ps=[...state.projects].sort(sortP).filter(p=>!state.ft||ptype(p)===state.ft);
  if(state.fp&&!ps.some(p=>p.id===state.fp))state.fp="";
  $("#f-project").innerHTML=`<option value="">Todos os projetos</option>`+ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  $("#f-person").innerHTML=`<option value="">Todos os sucessores</option><option value="${NONE}">Sem sucessor(a)</option>`+people().map(p=>`<option>${esc(p)}</option>`).join("");
  $("#f-status").innerHTML=`<option value="">Todos os status</option>`+STATUSES.map(s=>`<option>${s[0]}</option>`).join("");
  $("#f-hand").innerHTML=`<option value="">Atualizar, manter ou criar</option>`+HAND.map(h=>`<option>${h[0]}</option>`).join("");
  $("#f-type").value=state.ft;$("#f-project").value=state.fp;$("#f-person").value=state.fperson;$("#f-status").value=state.fs;$("#f-hand").value=state.fh;$("#f-q").value=state.q;$("#f-open").checked=state.open;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===state.view));
}

const tickSvg='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 6.5l2.2 2.2L9.5 3.8"/></svg>';
function whoHTML(t){return t.successor?`<span class="who" title="Atual: ${esc(t.owner)}">${esc(t.successor)}</span>`:`<span class="who none">Definir sucessor(a)</span>`}
function handHTML(t){const h=t.handover||"A avaliar";return `<span><span class="pill ${HC[h]||"h-eval"}" title="${esc((HAND.find(x=>x[0]===h)||[])[2]||"")}">${esc(h)}</span></span>`}
function dueHTML(t){if(t.status==="Concluído")return `<span class="due ok" title="Concluída em">${t.doneAt?"✓ "+fmtDate(t.doneAt):"✓"}</span>`;return t.due?`<span class="due ${t.due<today()&&t.status!=="Concluído"?"late":""}">${fmtDate(t.due)}</span>`:`<span class="due">—</span>`}

function projStats(p){
  const pt=state.tasks.filter(t=>t.project===p.id),open=pt.filter(t=>t.status!=="Concluído");
  return {total:pt.length,done:pt.length-open.length,open:open.length,nosucc:open.filter(t=>!t.successor).length,block:pt.filter(t=>t.status==="Bloqueado").length,
    who:[...new Set(pt.map(t=>t.successor).filter(Boolean))]};
}
function byType(ps,fn){
  return types().filter(t=>ps.some(p=>ptype(p)===t)).map(t=>{const g=ps.filter(p=>ptype(p)===t);
    return `<section class="tgroup" style="--tc:${tcolor(t)}"><div class="thead"><h2>${esc(t)}</h2><span>${g.length} projeto${g.length>1?"s":""}</span></div>${fn(g)}</section>`}).join("");
}
function renderMeasure(ps){
  const ids=new Set(ps.map(p=>p.id)), T=state.tasks.filter(t=>ids.has(t.project));
  const wk=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const row=(label,ts,color)=>{const d=ts.filter(t=>t.status==="Concluído").length,pc=ts.length?Math.round(d/ts.length*100):0,c=h=>ts.filter(t=>(t.handover||"A avaliar")===h&&t.status!=="Concluído").length;
    return `<td>${label}</td><td class="n">${ts.length}</td><td class="n">${d}</td><td class="pc"><span class="mini"><span class="bar"><i style="width:${pc}%;background:${color}"></i></span>${pc}%</span></td>
      <td class="n">${ts.filter(t=>t.doneAt&&t.doneAt>=wk).length}</td><td class="n">${c("Atualizar")}</td><td class="n">${c("Manter")}</td><td class="n">${c("Criar")}</td><td class="n">${c("A avaliar")}</td>`};
  const tl=types().filter(t=>ps.some(p=>ptype(p)===t));
  return `<div class="measure"><table><thead><tr><th>Medição por tipo</th><th>Tarefas</th><th>Concluídas</th><th>% concluído</th><th>Últimos 7 dias</th><th>Atualizar</th><th>Manter</th><th>Criar</th><th>A avaliar</th></tr></thead>
    <tbody>${tl.map(t=>`<tr>${row(`<span style="color:${tcolor(t)}">${esc(t)}</span>`,T.filter(x=>ptype(state.projects.find(p=>p.id===x.project))===t),tcolor(t))}</tr>`).join("")}</tbody>
    <tfoot><tr>${row("Total",T,"var(--accent)")}</tr></tfoot></table></div>
    <p class="notice" style="margin-top:-12px">Concluídas continuam no quadro com a data de conclusão. As colunas Atualizar/Manter/Criar contam só o que ainda está pendente.</p>`;
}
function renderProjects(){
  const ps=visProjects();
  if(!ps.length)return `<div class="empty">Nenhum projeto com esses filtros.</div>`;
  return `<div class="stack">${renderMeasure(ps)}${byType(ps,g=>`<div class="dir">${g.map(p=>{const k=projStats(p),pc=k.total?Math.round(k.done/k.total*100):0;
    return `<button class="pcard" data-goto="${esc(p.id)}"><span class="tchip">${esc(ptype(p))}</span><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
      <div class="bar"><i style="width:${pc}%;background:var(--tc)"></i></div>
      <span class="nums"><span><b>${k.done}/${k.total}</b> concluídas</span><span><b>${k.open}</b> pendentes</span><span><b class="${k.nosucc?"w":""}">${k.nosucc}</b> sem sucessor(a)</span></span>
      <span class="nums">${k.who.length?"Sucessor(es): "+esc(k.who.join(", ")):"Sucessor(a) ainda não definido(a)"}</span></button>`}).join("")}</div>`)}</div>`;
}

function renderUnis(){
  const q=state.q.trim().toLowerCase();
  const all=state.contacts, C=all.filter(c=>(!state.cs||c.status===state.cs)&&(!q||Object.values(c).join(" ").toLowerCase().includes(q)));
  const funnel=`<div class="funnel">${[["",`Todos`]].concat(CSTAT.map(x=>[x[0],x[0]])).map(([v,l])=>`<button data-cs="${esc(v)}" aria-pressed="${state.cs===v}"><span>${esc(l)}</span><b>${v?all.filter(c=>c.status===v).length:all.length}</b></button>`).join("")}</div>`;
  const insts=[...new Set(C.map(c=>c.inst))].sort((a,b)=>{const oa=Math.min(...C.filter(c=>c.inst===a).map(c=>c.order||0)),ob=Math.min(...C.filter(c=>c.inst===b).map(c=>c.order||0));return oa-ob||a.localeCompare(b)});
  const rows=insts.map(i=>{const g=C.filter(c=>c.inst===i).sort((a,b)=>(a.order||0)-(b.order||0));const info=g.find(c=>c.reach)?.reach||"";
    return `<tr class="inst"><td colspan="6">${esc(i)}${info?`<small>${esc(info)}</small>`:""}</td></tr>`+g.map(c=>`<tr data-contact="${esc(c.id)}">

      <td>${c.name?esc(c.name):`<span class="who none">Mapear</span>`}<div class="muted">${esc([c.role,c.email,c.phone].filter(Boolean).join(" · "))}</div></td>
      <td><span class="pill ${CC[c.status]||"c-map"}">${esc(c.status||"Mapear contato")}</span></td>
      <td>${esc(c.next||"")}${c.date?`<div class="muted">${fmtDate(c.date)}</div>`:""}</td>
      <td>${c.owner?esc(c.owner):`<span class="who none">Definir</span>`}</td>
      <td class="muted">${esc(c.notes||"")}</td></tr>`).join("")}).join("");
  return `<div class="stack">${funnel}<div class="uni"><table><thead><tr><th>Canal · cursos</th><th>Contato</th><th>Status</th><th>Próxima ação</th><th>Responsável</th><th>Notas</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="6" class="muted">Nenhum contato com esses filtros. Use “+ Contato” para cadastrar.</td></tr>`}</tbody></table></div>
    <p class="notice" style="margin-top:-12px">Relacionamento com as universidades target do Programa Delta. Clique numa linha para editar contato, status e próxima ação.</p></div>`;

function contactsCsv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;

  return "\ufeff"+[head.map(q).join(","),...[...state.contacts].sort((a,b)=>(a.order||0)-(b.order||0)).map(c=>[c.inst,c.channel,c.name,c.role,c.email,c.phone,c.status,c.next,c.date,c.owner,c.courses,c.notes].map(q).join(","))].join("\r\n");
}

function renderList(list){
  const ps=visProjects();
  const one=p=>{
    const pt=list.filter(t=>t.project===p.id).sort(sortT);
    if(!pt.length&&(state.q||state.fperson||state.fs||state.open))return "";
    const secs=[...new Set(pt.map(t=>t.section||"Geral"))];
    const rows=secs.map(s=>`<div class="section-label">${esc(s)}</div>`+pt.filter(t=>(t.section||"Geral")===s).map(t=>`
      <div class="trow ${t.status==="Concluído"?"done-row":""}">
        <button class="tick" role="checkbox" aria-checked="${t.status==="Concluído"}" aria-label="Concluir" data-tick="${esc(t.id)}" ${state.canWrite?"":"disabled"}>${t.status==="Concluído"?tickSvg:""}</button>
        <button class="tt" data-open="${esc(t.id)}"><strong>${esc(t.title)}</strong><small>${esc(t.deliverable||t.notes)}</small></button>
        ${whoHTML(t)}
        <span><span class="pill ${SC[t.status]||"s-todo"}">${esc(t.status)}</span></span>
        ${handHTML(t)}
        <span class="prio ${esc(t.priority)}">${esc(t.priority)}</span>
        ${dueHTML(t)}
      </div>`).join("")).join("");
    return `<section class="project">
      <div class="phead"><div><span class="tchip">${esc(ptype(p))}</span><h2>${esc(p.name)}</h2><p>${esc(p.desc)}</p></div>
      <div style="display:flex;gap:6px"><button class="btn" data-addin="${esc(p.id)}" ${state.canWrite?"":"disabled"}>+ Tarefa</button><button class="btn" data-editp="${esc(p.id)}" ${state.canWrite?"":"disabled"}>Editar</button></div></div>
      <div class="scroll"><div class="trow head"><span></span><span>Tarefa · entregável</span><span>Sucessor(a)</span><span>Status</span><span>Repasse</span><span>Prior.</span><span>Prazo</span></div>
      ${rows||`<div class="trow"><span></span><span class="notice">Nenhuma tarefa ainda.</span></div>`}</div></section>`;
  };
  const out=byType(ps,g=>g.map(one).join(""));

}

function renderPeople(list){
  const ps=visProjects();
  const open=list.filter(t=>t.status!=="Concluído");
  const names=[...people(),NONE];
  const rows=names.map(n=>{
    const mine=open.filter(t=>n===NONE?!t.successor:t.successor===n);
    if(!mine.length&&n!==NONE)return "";
    return `<tr class="${n===NONE?"person-none":""}"><td>${n===NONE?"Sem sucessor(a)":esc(n)}</td>${ps.map(p=>{const k=mine.filter(t=>t.project===p.id).length;
      return `<td class="n">${k?`<button data-pf="${esc(p.id)}" data-pp="${esc(n)}">${k}</button>`:`<span class="z">·</span>`}</td>`}).join("")}<td class="n"><b>${mine.length}</b></td></tr>`}).join("");
  return `<div class="matrix"><table><thead><tr><th></th>${types().filter(t=>ps.some(p=>ptype(p)===t)).map(t=>`<th colspan="${ps.filter(p=>ptype(p)===t).length}" style="color:${tcolor(t)}">${esc(t)}</th>`).join("")}<th></th></tr>
  <tr><th>Sucessor(a)</th>${ps.map(p=>`<th>${esc(p.name)}</th>`).join("")}<th>Total</th></tr></thead><tbody>${rows}</tbody></table></div>

}

    <div class="field"><label for="p-desc">Descrição e escopo</label><textarea id="p-desc" ${ro}>${esc(p.desc)}</textarea></div>
  </form>
  <div class="dfoot"><span class="msg" id="d-msg"></span><button class="btn primary" id="d-save" ${ro}>Salvar</button></div>`);
  $("#d-close").onclick=closeDrawer;
  $("#pform").onsubmit=e=>{e.preventDefault();$("#d-save").click()};
  $("#d-save").onclick=async()=>{
    const name=$("#p-name").value.trim(); if(!name){$("#d-msg").textContent="Dê um nome ao projeto.";return}
    const body={name,type:$("#p-type").value.trim()||"Outros",desc:$("#p-desc").value.trim(),order:isNew?Math.max(-1,...state.projects.map(x=>x.order))+1:p.order};
    try{await state.db.collection("projects").doc(p.id).set(body);closeDrawer();toast("Projeto salvo")}catch(err){$("#d-msg").textContent=writeErr(err)}
  };
}

function writeErr(err){
  if(err&&err.code==="invalid_argument"){state.canWrite=false;render();return "Sem permissão para editar. Peça acesso de Colaborador à dona do quadro."}
  if(err&&err.code==="quota_exceeded")return "O quadro atingiu o limite de itens. Exclua tarefas antigas e tente de novo.";
  return "Não foi possível salvar agora. Tente de novo em instantes.";
}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* eventos */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;try{localStorage.setItem("repasse-view",state.view)}catch(e){}syncFilters();render()});
$("#f-type").onchange=e=>{state.ft=e.target.value;syncFilters();render()};
$("#f-project").onchange=e=>{state.fp=e.target.value;render()};
$("#f-person").onchange=e=>{state.fperson=e.target.value;render()};
$("#f-status").onchange=e=>{state.fs=e.target.value;render()};
$("#f-hand").onchange=e=>{state.fh=e.target.value;render()};
$("#f-q").oninput=e=>{state.q=e.target.value;render()};
$("#f-open").onchange=e=>{state.open=e.target.checked;render()};
$("#btn-task").onclick=()=>{if(!state.projects.length){projectForm({id:newId("p"),name:"",type:state.ft,desc:""},true);return}
  taskForm({id:newId("t"),project:state.fp||visProjects().concat([...state.projects].sort(sortP))[0].id,section:"",title:"",status:"A fazer",handover:"A avaliar",priority:"Média",owner:"Suellen Pereira da Silva",successor:"",due:"",link:"",deliverable:"",notes:""},true)};
$("#btn-contact").onclick=()=>contactForm({id:newId("c"),inst:"",channel:CHANNELS[0],name:"",role:"",email:"",phone:"",status:"Mapear contato",owner:"",next:"",date:"",courses:"",notes:""},true);
$("#btn-proj").onclick=()=>projectForm({id:newId("p"),name:"",type:state.ft,desc:""},true);
$("#view").addEventListener("click",async e=>{
  const cs=e.target.closest("[data-cs]"); if(cs){state.cs=cs.dataset.cs;render();return}
  const ct=e.target.closest("[data-contact]"); if(ct){const c=state.contacts.find(x=>x.id===ct.dataset.contact);c&&contactForm(c,false);return}
  const g=e.target.closest("[data-goto]"); if(g){state.fp=g.dataset.goto;state.view="list";try{localStorage.setItem("repasse-view","list")}catch(x){}syncFilters();render();window.scrollTo({top:0});return}
  const o=e.target.closest("[data-open]"); if(o){const t=state.tasks.find(x=>x.id===o.dataset.open);t&&taskForm(t,false);return}
  const a=e.target.closest("[data-addin]"); if(a){taskForm({id:newId("t"),project:a.dataset.addin,section:"",title:"",status:"A fazer",handover:"A avaliar",priority:"Média",owner:"Suellen Pereira da Silva",successor:"",due:"",link:"",deliverable:"",notes:""},true);return}
  const ep=e.target.closest("[data-editp]"); if(ep){const p=state.projects.find(x=>x.id===ep.dataset.editp);p&&projectForm(p,false);return}
  const pf=e.target.closest("[data-pf]"); if(pf){state.fp=pf.dataset.pf;state.fperson=pf.dataset.pp;state.open=true;state.view="list";syncFilters();render();return}
  const tk=e.target.closest("[data-tick]"); if(tk&&state.canWrite){
    const t=state.tasks.find(x=>x.id===tk.dataset.tick); if(!t)return;
    const status=t.status==="Concluído"?"A fazer":"Concluído"; tk.disabled=true;
    try{await state.db.collection("tasks").doc(t.id).update({status,doneAt:status==="Concluído"?today():"",updatedAt:new Date().toISOString()});toast(status==="Concluído"?"Concluída":"Reaberta")}
    catch(err){toast(writeErr(err))} finally{tk.disabled=false}
  }
});

/* exportação CSV para importar no Asana */
function csv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const head=["Name","Section/Column","Tipo de projeto","Assignee","Due Date","Description","Status","Situação no repasse","Concluída em","Prioridade","Responsável atual","Sucessor(a)","Entregável","Link"];
  const rows=[...state.tasks].sort((a,b)=>{const pa=state.projects.find(p=>p.id===a.project),pb=state.projects.find(p=>p.id===b.project);return(pa&&pb?sortP(pa,pb):0)||sortT(a,b)})
    .map(t=>[t.title,pname(t.project)+" · "+(t.section||"Geral"),ptype(state.projects.find(p=>p.id===t.project)),"",t.due,`Entregável: ${t.deliverable}\n${t.notes}${t.link?"\nLink: "+t.link:""}`,t.status,t.handover||"A avaliar",t.doneAt||"",t.priority,t.owner,t.successor,t.deliverable,t.link].map(q).join(","));
  return "﻿"+[head.map(q).join(","),...rows].join("\r\n");
}

/* boot */
syncFilters();render();
(async()=>{
  const c=window.claude;
  const [db,user,dl]=await Promise.all([c?.use?.("db"),c?.use?.("user"),c?.use?.("downloads")].map(p=>Promise.resolve(p).catch(()=>null)));
  if(dl){state.dl=dl;$("#btn-ccsv").onclick=async()=>{try{await dl.save({filename:"delta-universidades-contatos.csv",data:contactsCsv()});toast("CSV pronto")}catch(e){toast("Download cancelado")}};const b=$("#btn-csv");b.hidden=state.view==="unis";b.onclick=async()=>{try{await dl.save({filename:"repasse-inhire-asana.csv",data:csv()});toast("CSV pronto")}catch(e){toast("Download cancelado")}}}
  if(!db){$("#notice").textContent="Entre na sua conta Claude para ver e editar o quadro.";state.canWrite=false;["#btn-task","#btn-proj"].forEach(s=>$(s).disabled=true);render();return}
  state.db=db;
  if(user){try{const w=await user.can("data.write");if(w===false){state.canWrite=false;["#btn-task","#btn-proj"].forEach(s=>$(s).disabled=true)}}catch(e){}}
  $("#notice").textContent=state.canWrite?"Alterações ficam salvas e aparecem para todo mundo que abrir esta página.":"Você está no modo leitura.";
  db.collection("projects").onSnapshot(s=>{state.projects=s.docs.map(d=>({id:d.id,...d.data()}));syncFilters();render()},()=>{$("#notice").textContent="Não foi possível carregar os projetos. Recarregue a página."});
  db.collection("contacts").onSnapshot(s=>{state.contacts=s.docs.map(d=>({id:d.id,...d.data()}));if(state.view==="unis")render()},()=>{});
  db.collection("tasks").onSnapshot(s=>{state.tasks=s.docs.map(d=>({id:d.id,...d.data()}));syncFilters();render()},()=>{$("#notice").textContent="Não foi possível carregar as tarefas. Recarregue a página."});
})();
</script>
